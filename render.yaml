services:
  - type: web
    name: car-rental-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://car-rental-project-k0e4.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
